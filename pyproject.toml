[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ligandff"            # LigandFF (SPEC D1, decided 2026-10-30)
version = "0.1.0.dev0"
description = "Open-source, CGenFF-compatible atom typing and parameter/charge assignment (clean-room reimplementation)"
requires-python = ">=3.10"
dependencies = ["rdkit>=2024.3", "networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
export = ["openmm>=8.0", "parmed>=4.2"]

[project.scripts]
ligandff-bench = "ligandff.benchmarks.runner:main"
ligandff = "ligandff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ligandff.typing" = ["rules/*.rules"]
"ligandff.params" = ["rules/*.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
